version: '3.8'

services:
  web:
    build: .
    container_name: exploreghana_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://yerbo:securepass@db:5432/exploreghana
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:15-3.3
    container_name: exploreghana_postgis
    restart: unless-stopped
    environment:
      - POSTGRES_USER=yerbo
      - POSTGRES_PASSWORD=securepass
      - POSTGRES_DB=exploreghana
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yerbo -d exploreghana"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
